name: Publish Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # check-versions compare la version au dernier commit qui l'a bumpée :
          # un checkout superficiel n'a pas cet historique.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@umbeli-com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Un package dont le src/ a bougé sans bump de version est SAUTÉ à la publication.
      # Les cinq packages sont restés en 1.0.0 pendant des dizaines de commits : le job
      # passait au vert en ne livrant rien. On échoue maintenant explicitement.
      - name: Check versions reflect source
        run: node scripts/check-versions.mjs

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        run: |
          published=0
          skipped=0
          for package_dir in packages/ui packages/auth packages/layout packages/billing packages/e2e; do
            package_name=$(node -p "require('./${package_dir}/package.json').name")
            package_version=$(node -p "require('./${package_dir}/package.json').version")

            if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "· ${package_name}@${package_version} déjà publié — sauté."
              skipped=$((skipped + 1))
              continue
            fi

            ( cd "${package_dir}" && pnpm publish --no-git-checks )
            echo "✓ ${package_name}@${package_version} publié."
            published=$((published + 1))
          done

          {
            echo "### Publication"
            echo ""
            echo "- ${published} package(s) publié(s)"
            echo "- ${skipped} déjà à jour"
          } >> "$GITHUB_STEP_SUMMARY"
