name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Chaque composant exporté doit avoir du CSS dans le bundle : DetailedChart et
      # LanguageSwitcher ont été livrés sans feuille de style et personne ne l'a vu.
      - name: Every styled component ships CSS
        run: node scripts/check-styles.mjs
