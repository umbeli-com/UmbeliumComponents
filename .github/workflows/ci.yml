name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le build AVANT le typecheck : billing importe @umbeli-com/ui, dont les
      # types pointent sur dist/ — absent d'un checkout propre (dist est gitignoré).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Le script `lint` existait sans qu'ESLint soit installé : il n'avait
      # jamais tourné. Socle identique aux apps (typescript-eslint + react-hooks).
      - name: Lint
        run: pnpm lint

      # Chaque composant exporté doit avoir du CSS dans le bundle : DetailedChart et
      # LanguageSwitcher ont été livrés sans feuille de style et personne ne l'a vu.
      - name: Styles câblées + tokens définis
        run: node scripts/check-styles.mjs
